name: New app
description: Propose a new app for the Callanix Store. No repo access needed.
title: ""
labels: ["app-submission", "req-new"]
body:
  - type: input
    id: app-title
    attributes:
      label: App title
      description: Display name as it should appear in the store.
      placeholder: e.g. My Amazing App
  - type: input
    id: category
    attributes:
      label: Category
      description: One word.
      placeholder: Games, Tools, Entertainment, Education or Other
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Max 4,000 characters. Line breaks are kept exactly as written.
      placeholder: What does this app do?
    validations:
      required: true
  - type: input
    id: app-url
    attributes:
      label: App URL
      description: The final destination link users land on.
      placeholder: https://yourapp.com
  - type: input
    id: ad-url
    attributes:
      label: Ad gateway URL (optional)
      description: Shown for 5 seconds before the app link. Leave empty for a direct link.
      placeholder: https://ad-link.com/your-ad
  - type: input
    id: icon-url
    attributes:
      label: Icon URL (IMPORTANT — required)
      description: Square badge shown on the store row. Required — proves ownership for updates / removals.
      placeholder: https://example.com/icon.png
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot URLs (IMPORTANT — required, one per line, max 5)
      description: One URL per line, 1 to 5 required.
      placeholder: |
        https://example.com/shot1.jpg
        https://example.com/shot2.jpg
    validations:
      required: true
  - type: input
    id: contact-email
    attributes:
      label: Contact email (IMPORTANT — required)
      description: Your private app ID is emailed here and scrubbed off this public page.
      placeholder: you@example.com
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have the right to share this app and its links
          required: true
