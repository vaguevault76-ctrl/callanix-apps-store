name: Publish apps

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-apps
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'app-submission') || github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved submissions
        id: apply
        run: node .github/scripts/publish.mjs apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Commit store data
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "callanix-publisher"
          git config user.email "callanix-publisher@users.noreply.github.com"
          git add data/links.json
          git diff --cached --quiet || git commit -m "Publish apps from submissions"
          git push
      - name: Report results on issues
        if: success()
        run: node .github/scripts/publish.mjs report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
